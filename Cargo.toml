[package]
name = "dps"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "System-wide audio processor for macOS that needs no virtual audio driver; also processes audio files"
repository = "https://github.com/chauduyphanvu/dps-rs"
homepage = "https://github.com/chauduyphanvu/dps-rs"
readme = "README.md"
keywords = ["audio", "macos", "equalizer", "loudness", "dsp"]
categories = ["multimedia::audio", "command-line-utilities"]
rust-version = "1.95"
# The name dps on crates.io belongs to an unrelated project, so releases go through GitHub and Homebrew.
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29.0", default-features = false }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSValue"] }
