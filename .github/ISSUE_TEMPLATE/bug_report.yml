name: Bug report
description: Something tonewell does that it should not, or does not do that it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "`tonewell --version` output"
      placeholder: tonewell 0.1.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version, or OS for file processing
      placeholder: macOS 15.1
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`tonewell doctor` output"
      description: "Run `tonewell doctor` and paste the output; it lists the output device and the apps playing audio, so remove anything you'd rather not share."
      render: text
  - type: input
    id: output-device
    attributes:
      label: Output device
      placeholder: MacBook Pro Speakers, AirPods Pro
