# Preset "voice": speech intelligibility: rumble cut, presence lift, firm
# levelling, stereo off. A starting point reasoned from what each stage of
# the chain does, not a Bongiovi tuning (the patents publish none).

input_gain_db = 0.0
# Gain added back after the levelling; the limiter below catches the peaks
# it raises. Measured (BS.1770) at 48 kHz: speech (macOS text-to-speech) at
# -16 LUFS comes out 1.5 LU louder and at -24 LUFS 6.9 LU louder; a synthetic
# band mix at -14 LUFS 0.2 LU quieter, at -20 LUFS 3.7 LU louder and at -30
# LUFS 7.6 LU louder. Loud masters, which the firm levelling turns down
# most, still come out quieter: one at -8 LUFS by 5.2 LU, one at -4 LUFS by
# 8.0 LU.
output_gain_db = 9.5
shelf_corner_hz = 1000.0
# Compressor 1 hears lows 10 dB quieter, so plosives and rumble do not set
# it off, and highs 8 dB louder, so sibilance does, a mild de-esser. The
# mirrored shelves after it restore the tone.
low_shelf_db = -10.0
high_shelf_db = 8.0

# Firm levelling evens out loud and soft speakers.
[compressor1]
threshold_db = -28.0
ratio = 2.5
attack_ms = 5.0
release_ms = 100.0

[compressor2]
threshold_db = -20.0
ratio = 3.0
attack_ms = 3.0
release_ms = 80.0

# Cut rumble at 30-56 Hz and some boom at 106-375 Hz, lift 1.3-4.7 kHz
# where consonants carry intelligibility, and ease hiss at 16 kHz.
[eq]
freqs_hz = [30.0, 56.4, 106.0, 199.0, 375.0, 705.0, 1327.0, 2497.0, 4698.0, 8839.0, 16000.0]
q = [1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
gains_db = [-6.0, -4.0, -1.0, -1.0, -1.5, 0.0, 1.0, 3.0, 2.5, 0.0, -2.0]

# Off: widening speech mostly spreads room sound and noise.
[stereo]
enabled = false
crossover_hz = 200.0
side_boost_db = 8.0
threshold_db = -30.0
ratio = 4.0
attack_ms = 10.0
release_ms = 200.0

# The last stage: no sample leaves above -1 dBFS. On the material above it
# takes at most 0.5 dB off speech, 1.4 dB off music peaks within a passage
# and nothing off the -20 LUFS mix; where loud music starts, or comes back
# after a quiet break, before the compressors react, up to 9.2 dB for a
# moment, and 12.8 dB at an abrupt full-scale start.
[limiter]
enabled = true
ceiling_db = -1.0
release_ms = 100.0
