# Preset "laptop-speakers": bass heard through its harmonics, more presence,
# firm levelling, wider stereo. A starting point reasoned from what each
# stage of the chain does, not a Bongiovi tuning (the patents publish none).

input_gain_db = 0.0
# Gain added back after the levelling; the limiter below catches the peaks
# it raises. Measured (BS.1770) at 48 kHz on a synthetic band mix, once the
# leveler has settled: at -14 LUFS it comes out 0.9 LU quieter, at -14.9
# LUFS, as BS.1770 counts the lows the bass stage takes out (without that
# stage, 0.4 LU louder), and at -20, -8 and -4 LUFS just as loud; at -30
# LUFS, past the leveler's 12 dB of boost, at -15.5 LUFS. Speech (macOS
# text-to-speech) at -16 and -24 LUFS comes out at -14.2 LUFS. Settling
# takes 3-6 s, 11 s for speech at -24 LUFS and 12 s for the mix at -30; over
# the first 8 s a -4 LUFS mix comes out 10.6 LU quieter and a -30 LUFS one
# 10.4 LU louder.
output_gain_db = 7.0
shelf_corner_hz = 1000.0
# Compressor 1 hears bass 10 dB quieter, so bass the speakers cannot play
# does not pump what they can. The mirrored shelves after it restore the
# tone.
low_shelf_db = -10.0
high_shelf_db = 6.0

# Brings every source to -14 LUFS before the compressors, within 12 dB
# either way, so they work where they were balanced whatever the master's
# level. The default rates take little off a song's own dynamics: the band
# mix's 4.6 LU step from verse to chorus comes out 1.2 LU, against 1.3 LU
# without the leveler.
[leveler]
enabled = true
target_lufs = -14.0
max_boost_db = 12.0
max_cut_db = 12.0
rise_db_per_s = 1.0
fall_db_per_s = 4.0

# Firmer levelling, so quiet passages stay audible on small speakers.
[compressor1]
threshold_db = -24.0
ratio = 2.5
attack_ms = 5.0
release_ms = 120.0

[compressor2]
threshold_db = -18.0
ratio = 3.0
attack_ms = 3.0
release_ms = 100.0

# The bands below 199 Hz stay flat: the bass stage below makes its
# harmonics from those lows before it takes them out, and a cut here would
# shrink the harmonics. The cost is that compressor 2 hears the lows: on the
# settled -14 LUFS mix it turns down about 0.8 dB more. Upper bass at 200 Hz
# gives fullness the speakers can play, 2.5-4.7 kHz presence adds clarity,
# and the top octave is left alone, since boosting it on small tweeters
# mostly adds hiss.
[eq]
freqs_hz = [30.0, 56.4, 106.0, 199.0, 375.0, 705.0, 1327.0, 2497.0, 4698.0, 8839.0, 16000.0]
q = [1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
gains_db = [0.0, 0.0, 0.0, 2.0, -1.0, 0.0, 1.0, 2.5, 2.5, 1.0, 0.0]

# Laptop speakers play little below about 150 Hz, so the bass below it gets
# harmonics, which they can play and from which the ear still hears its
# pitch; together 3 dB under a note an octave below the cutoff. remove_lows
# then takes out the lows themselves, which would only use up headroom.
# Measured on the band mix: BS.1770 reads the output 1.3 LU quieter with
# this stage, but above 150 Hz, what the speakers play, 2.3 LU louder.
[bass]
enabled = true
cutoff_hz = 150.0
harmonics_db = -3.0
remove_lows = true

# Off: its bass shelf at 120 Hz would put back what remove_lows takes out,
# and its treble shelf would lift the top octave the EQ leaves alone.
[contour]
enabled = false
reference_db = -12.0
bass_per_db = 0.35
treble_per_db = 0.1
max_bass_db = 9.0
max_treble_db = 4.0

# The two speakers sit close together, so the side signal gets up to 4 dB
# above 500 Hz to widen a narrow image.
[stereo]
enabled = true
crossover_hz = 500.0
side_boost_db = 4.0
threshold_db = -30.0
ratio = 4.0
attack_ms = 10.0
release_ms = 200.0

# Off: it is for headphones.
[crossfeed]
enabled = false
cutoff_hz = 700.0
level_db = -4.5

# Off: `dps import` fills it for a measured headphone or speaker.
[correction]
enabled = false
preamp_db = 0.0
bands = []

# The last stage: no sample leaves above -1 dBFS. The lookahead brings the
# gain down over 1.5 ms instead of at once, and true peak also counts peaks
# between samples. Once the leveler has settled it takes at most 1.6 dB off
# peaks of the mixes above and 0.6 dB off speech. For about a tenth of a
# second it takes more where loud music starts before the leveler and
# compressors catch up: up to 9.8 dB at the start of a -4 LUFS mix, 10.6 dB
# at an abrupt full-scale start, and 13.5 dB where loud music follows 10 s
# of quiet music that the leveler has turned up.
[limiter]
enabled = true
ceiling_db = -1.0
release_ms = 100.0
lookahead_ms = 1.5
true_peak = true
