# Preset "music": a moderate all-rounder. A starting point reasoned from what
# each stage of the chain does, not a Bongiovi tuning (the patents publish
# none).

input_gain_db = 0.0
# Gain added back after the levelling; the limiter below catches the peaks
# it raises. Measured (BS.1770) on synthetic program material at 48 kHz: a
# band mix at -14 LUFS comes out 0.6 LU louder, at -20 LUFS 4.6 LU louder and
# at -30 LUFS 6.2 LU louder; speech at -16 LUFS 1.7 LU louder. Loud masters,
# which the levelling turns down most, still come out quieter: one at -8
# LUFS by 3.8 LU, one at -4 LUFS by 6.9 LU.
output_gain_db = 4.0
shelf_corner_hz = 1000.0
# Compressor 1 hears bass 8 dB quieter and treble 6 dB louder, so kick and
# bass do not pump the mix and harsh peaks are what it reacts to. The
# mirrored shelves after it restore the tone.
low_shelf_db = -8.0
high_shelf_db = 6.0

# Lighter levelling than laptop-speakers and voice.
[compressor1]
threshold_db = -24.0
ratio = 2.0
attack_ms = 15.0
release_ms = 150.0

# Final levelling after the EQ, catching what compressor 1 let through.
[compressor2]
threshold_db = -14.0
ratio = 2.5
attack_ms = 5.0
release_ms = 150.0

# A mild smile: about +3 dB at 50-100 Hz and at 8 kHz, -1 dB around 400 Hz.
[eq]
freqs_hz = [30.0, 56.4, 106.0, 199.0, 375.0, 705.0, 1327.0, 2497.0, 4698.0, 8839.0, 16000.0]
q = [1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
gains_db = [1.0, 2.5, 2.0, 0.5, -1.0, -0.5, 0.0, 0.5, 1.5, 2.0, 1.0]

# Some widening: the side signal up to 3 dB louder above 300 Hz, pulled back
# while the mix is loud.
[stereo]
enabled = true
crossover_hz = 300.0
side_boost_db = 3.0
threshold_db = -30.0
ratio = 4.0
attack_ms = 10.0
release_ms = 200.0

# The last stage: no sample leaves above -1 dBFS. On the material above it
# takes at most 1.8 dB off peaks within a passage and nothing off the -20
# LUFS mix; where loud music starts, or comes back after a quiet break,
# before the compressors react, up to 5.4 dB for a moment, and 7.8 dB at an
# abrupt full-scale start.
[limiter]
enabled = true
ceiling_db = -1.0
release_ms = 100.0
